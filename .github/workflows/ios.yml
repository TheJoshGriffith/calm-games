name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  games:
    # Every game with an iOS app (games/<name>/app/ios/Info.plist.in) gets its
    # own build and simulator launch. The scheme is the app's CMake target and
    # the bundle ID is com.thejoshgriffith.calm.<name>.
    name: Find iOS games
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          games = []
          for plist in sorted(pathlib.Path("games").glob("*/app/ios/Info.plist.in")):
              name = plist.parts[1]
              cmake = (plist.parents[1] / "CMakeLists.txt").read_text()
              scheme = re.search(r"qt_add_executable\((\w+)", cmake).group(1)
              games.append({"name": name, "title": name.capitalize(), "scheme": scheme,
                            "bundle": f"com.thejoshgriffith.calm.{name}"})
          print("matrix=" + json.dumps({"include": games}))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.title }} (iOS)
    needs: games
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.games.outputs.matrix) }}
    env:
      # Signing and upload happen only on main, once the App Store Connect
      # secrets exist, and only for games listed in the TESTFLIGHT_GAMES repo
      # variable (space-separated; each needs its App Store Connect app record).
      # Pull requests and other games just check that the iOS build compiles.
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_ID != '' && secrets.APPLE_TEAM_ID != '' && contains(format(' {0} ', vars.TESTFLIGHT_GAMES || 'sudoku'), format(' {0} ', matrix.name)) }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with the iOS 26 SDK or later.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: ios
          arch: ios
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF \
            -DCALM_APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            -DCALM_BUILD_NUMBER="${{ github.run_number }}"

      - name: Build (unsigned)
        if: env.CAN_UPLOAD != 'true'
        run: |
          xcodebuild -project build-ios/CalmGames.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50
          exit "${PIPESTATUS[0]}"

      - name: Archive and upload to TestFlight
        if: env.CAN_UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # Archive unsigned and let the export sign with Apple's cloud-managed
          # distribution certificate. Signing the archive itself made Xcode
          # mint a new Apple Development certificate on every run (the runner
          # keychain is empty), until the account hit Apple's limit.
          xcodebuild -project build-ios/CalmGames.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO archive | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

          # An unsigned archive carries no entitlements, so sign the archived
          # app ad hoc (no certificate) with the game's entitlements; the
          # export re-signs it for distribution and keeps them. The App ID
          # needs the matching capability (e.g. Associated Domains) enabled.
          ENTITLEMENTS="games/${{ matrix.name }}/app/ios/app.entitlements"
          if [ -f "$ENTITLEMENTS" ]; then
            APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/${{ matrix.scheme }}.app"
            codesign --force --sign - --entitlements "$ENTITLEMENTS" --generate-entitlement-der "$APP"
            codesign -d --entitlements - "$APP"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"

          rm -f "$KEY_PATH"

  simulator:
    # Launches the real iOS app in the simulator with the QML smoke test, so a
    # start-up crash or missing QML import fails CI instead of TestFlight. The
    # app must honour CALM_SMOKE_TEST and append its messages to CALM_SMOKE_LOG
    # (see games/sudoku/app/main.cpp).
    name: ${{ matrix.title }} (iOS simulator launch)
    needs: games
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.games.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: ios
          arch: ios
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-sim -G Xcode \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF

      - name: Build for the simulator
        run: |
          xcodebuild -project build-sim/CalmGames.xcodeproj -scheme "${{ matrix.scheme }}" \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim/dd CODE_SIGNING_ALLOWED=NO build | tail -n 30
          exit "${PIPESTATUS[0]}"

      - name: Launch in the simulator
        run: |
          APP=$(find build-sim -path '*Release-iphonesimulator/${{ matrix.scheme }}.app' -type d | head -n 1)
          echo "App: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in sorted(devs.items(), reverse=True) if "iOS" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # The app appends its messages to CALM_SMOKE_LOG inside its own container.
          DATA=$(xcrun simctl get_app_container "$UDID" ${{ matrix.bundle }} data)
          LOG="$DATA/tmp/smoke.log"
          mkdir -p "$DATA/tmp"
          SIMCTL_CHILD_CALM_SMOKE_TEST=1 SIMCTL_CHILD_CALM_SMOKE_LOG="$LOG" \
            xcrun simctl launch "$UDID" ${{ matrix.bundle }}
          sleep 30
          echo "--- app log ---"
          cat "$LOG" || echo "(no log written)"
          echo "--- still running? ---"
          xcrun simctl spawn "$UDID" launchctl list | grep -i calm || echo "(not running)"
          grep -q "smoke test: ok" "$LOG"

      - name: Crash reports
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/${{ matrix.scheme }}* 2>/dev/null | head -n 1); do head -c 20000 "$f"; done
