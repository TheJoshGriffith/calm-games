name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sudoku:
    name: Sudoku (iOS)
    runs-on: macos-15
    env:
      # Signing and upload happen only on main, once the App Store Connect
      # secrets exist; pull requests just check that the iOS build compiles.
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' && secrets.ASC_KEY_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect only accepts builds made with the iOS 26 SDK or later.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: ios
          arch: ios
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF \
            -DCALM_APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            -DCALM_BUILD_NUMBER="${{ github.run_number }}"

      - name: Build (unsigned)
        if: env.CAN_UPLOAD != 'true'
        run: |
          xcodebuild -project build-ios/CalmGames.xcodeproj -scheme CalmSudoku \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 50
          exit "${PIPESTATUS[0]}"

      - name: Archive and upload to TestFlight
        if: env.CAN_UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          xcodebuild -project build-ios/CalmGames.xcodeproj -scheme CalmSudoku \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Sudoku.xcarchive" "${AUTH[@]}" archive | tail -n 50
          test "${PIPESTATUS[0]}" -eq 0

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sudoku.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"

          rm -f "$KEY_PATH"

  sudoku-simulator:
    # Launches the real iOS app in the simulator with the QML smoke test, so a
    # start-up crash or missing QML import fails CI instead of TestFlight.
    name: Sudoku (iOS simulator launch)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Install Qt for macOS (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: ios
          arch: ios
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-sim -G Xcode \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF

      - name: Build for the simulator
        run: |
          xcodebuild -project build-sim/CalmGames.xcodeproj -scheme CalmSudoku \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim/dd CODE_SIGNING_ALLOWED=NO build | tail -n 30
          exit "${PIPESTATUS[0]}"

      - name: Launch in the simulator
        run: |
          APP=$(find build-sim -path '*Release-iphonesimulator/CalmSudoku.app' -type d | head -n 1)
          echo "App: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in sorted(devs.items(), reverse=True) if "iOS" in rt for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_CALM_SMOKE_TEST=1 \
            timeout 120 xcrun simctl launch --console-pty --terminate-running-process "$UDID" com.thejoshgriffith.calm.sudoku \
            2>&1 | tee launch.log || true
          grep -q "smoke test: ok" launch.log

      - name: Crash reports
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/CalmSudoku* 2>/dev/null | head -n 1); do head -c 20000 "$f"; done
