name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push to main supersedes a queued one.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sudoku:
    name: Sudoku (WebAssembly)
    runs-on: ubuntu-latest
    env:
      # Deploys need the Cloudflare secrets. Pushes to main deploy production
      # (sudoku.gwynant.app); pull requests from this repository get a preview
      # deploy. Fork pull requests get no secrets, so they only build and test.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      # Qt 6.8 is built and tested against this Emscripten version.
      EMSDK_VERSION: '3.1.56'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for Linux (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Remember host Qt
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: 'qtmultimedia'
          cache: true

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          emcc --version | head -n 1
          # The all_os WebAssembly package loses its executable bits.
          chmod +x "$QT_ROOT_DIR"/bin/*
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCALM_BUILD_APPS=ON -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build-wasm --target CalmSudoku --parallel

      - name: Assemble site
        run: |
          games/sudoku/app/web/make-site.sh build-wasm site "${GITHUB_SHA::12}"
          wasm=site/CalmSudoku.wasm
          raw=$(stat -c %s "$wasm")
          gz=$(gzip -9 -c "$wasm" | wc -c)
          br=$( (brotli -c -q 11 "$wasm" 2>/dev/null || true) | wc -c)
          {
            echo "### Web build size"
            echo "| File | Raw | gzip -9 | brotli -q 11 |"
            echo "| --- | ---: | ---: | ---: |"
            echo "| CalmSudoku.wasm | $((raw / 1024)) KiB | $((gz / 1024)) KiB | $((br / 1024)) KiB |"
            for f in CalmSudoku.js qtloader.js; do
              echo "| $f | $(( $(stat -c %s site/$f) / 1024 )) KiB | $(( $(gzip -9 -c site/$f | wc -c) / 1024 )) KiB | |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Cloudflare Pages rejects any single file over 25 MiB.
          if [ "$raw" -gt $((25 * 1024 * 1024)) ]; then
            echo "::error::CalmSudoku.wasm is $raw bytes, over Cloudflare Pages' 25 MiB file limit"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # Loads the site in Chromium: QML smoke test, home and game screenshots,
      # a few real taps (sound must start), and a share link.
      - name: Smoke test in headless Chromium
        run: node games/sudoku/app/web/smoke.mjs site screens

      - name: Upload site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-web-site
          path: site
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-web-screenshots
          path: screens
          if-no-files-found: ignore

      # The Pages project gwynant-sudoku (production branch main) already
      # exists; --branch main is production, any other branch a preview.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.CAN_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=gwynant-sudoku --branch=${{ env.DEPLOY_BRANCH }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true

      - name: Deployment link
        if: env.CAN_DEPLOY == 'true'
        run: |
          echo "### Deployed ${DEPLOY_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"
