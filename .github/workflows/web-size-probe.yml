name: Web size probe

# TEMPORARY (branch web-size): measures what each game's .wasm is made of and
# how much candidate changes save. Removed before merging.
on:
  push:
    branches: [web-size]
  workflow_dispatch:

concurrency:
  group: web-size-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sudoku, target: CalmSudoku, branch: '', variants: 'none plugins controls wasmfonts videoshaders curveshaders all' }
          - { name: minesweeper, target: CalmMinesweeper, branch: minesweeper, variants: 'none all' }
          - { name: pinball, target: CalmPinball, branch: pinball, variants: 'none all' }
          - { name: solitaire, target: CalmSolitaire, branch: solitaire, variants: 'none all' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring in the game from its branch
        if: matrix.branch != ''
        run: git checkout origin/${{ matrix.branch }} -- games/${{ matrix.name }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: 'qtmultimedia'
          cache: true
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.56'
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y ninja-build brotli

      - name: Variants
        run: |
          chmod +x "$QT_ROOT_DIR"/bin/*
          app=build-wasm/games/${{ matrix.name }}/app
          sz() { printf "| %s | %d | %d | %d |\n" "$1" $(stat -c %s "$2") $(gzip -9 -c "$2" | wc -c) $(brotli -c -q 11 "$2" | wc -c); }
          echo "| Variant | Raw | gzip -9 | brotli -q 11 |" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: | ---: | ---: |" | tee -a "$GITHUB_STEP_SUMMARY"
          build() {
            label="$1"; trim="$2"; shift 2
            "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-wasm -G Ninja \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DQT_HOST_PATH="$QT_HOST_PATH" \
              -DQT_WASM_EXTRA_EXPORTED_METHODS="ENV,FS,addRunDependency,removeRunDependency" \
              -DCMAKE_EXE_LINKER_FLAGS="-lidbfs.js -Wl,--Map=$PWD/map-$label.txt $*" \
              -DCALM_WEB_TRIM="$trim" \
              -DCALM_GAMES=${{ matrix.name }} -DCALM_BUILD_APPS=ON -DCALM_BUILD_TESTS=OFF -DCALM_BUILD_TOOLS=OFF > configure-$label.log 2>&1 || { tail -40 configure-$label.log; return 1; }
            grep "Calm web" configure-$label.log || true
            if cmake --build build-wasm --target ${{ matrix.target }} --parallel > build-$label.log 2>&1; then
              cp $app/${{ matrix.target }}.wasm "v-$label.wasm"; cp $app/${{ matrix.target }}.js "v-$label.js"
              sz "$label" "v-$label.wasm" | tee -a "$GITHUB_STEP_SUMMARY"
              sz "$label (js)" "v-$label.js" | tee -a "$GITHUB_STEP_SUMMARY"
              ninja -C build-wasm -t commands ${{ matrix.target }} | tail -n 1 | tr ' ' '\n' | grep -E '(plugin|_init)\.(a|cpp\.o)$|libQt6' | sed 's|.*/||' | sort -u | tr '\n' ' ' > linked-$label.txt
              echo "linked: $(cat linked-$label.txt)"
            else
              echo "| $label | failed | | |" | tee -a "$GITHUB_STEP_SUMMARY"; grep -E "error|Error" build-$label.log | head -30
            fi
          }
          all="plugins;controls;wasmfonts;videoshaders;curveshaders"
          for v in ${{ matrix.variants }}; do
            case $v in
              none) build none "" ;;
              all) build all "$all" ;;
              *) build "$v" "$v" ;;
            esac
          done
          if [ "${{ matrix.name }}" = sudoku ]; then
            build all-Oz "$all" -Oz
            build all-closure "$all" --closure=1
            build all-converge "$all" -Oz -sBINARYEN_EXTRA_PASSES=--converge
          fi
          echo "== qml imports"; find build-wasm -path '*qml_imports*' -name '*.cmake' | head -3 | xargs -r cat | grep -i "plugin\|path" | head -40

      - name: Breakdown
        run: |
          for v in none all; do
            echo "### ${{ matrix.name }}: $v"
            python3 tools/web/wasm-size-report.py v-$v.wasm --map map-$v.txt --top 45 --title "${{ matrix.target }} ($v)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
